theme {
    # Эквивалент Style: kvantum-dark
    style = kvantum-dark

    # Эквивалент Color scheme: Style's colors
    # Оставляем пустым — hyprqt6engine возьмёт цвета из самого стиля Kvantum.
    color_scheme =

    # Если у вас были выбраны иконки, укажите их здесь (например, Papirus-Dark)
    icon_theme = Papirus-Dark

    # Шрифты (опционально; по умолчанию используется Sans Serif 11)
    font = Google Sans Flex 
    font_size = 11
}
