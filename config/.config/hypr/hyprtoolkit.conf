# Catppuccin Mocha (Lavender accent) theme for Hyprtoolkit
# ~/.config/hypr/hyprtoolkit.conf

# Colors
background = 0xFF11111B
base = 0xFF1E1E2E
text = 0xFFCDD6F4
alternate_base = 0xFF181825
bright_text = 0xFFF5E0DC
accent = 0xFFB4BEFE
accent_secondary = 0xFFB4BEFE

# Typography
h1_size=19
h2_size=15
h3_size=13
font_size=11
small_font_size=10

# Fonts
font_family=Sans Serif
font_family_monospace=monospace

# Icon theme (optional - set to Papirus or your preferred theme)
icon_theme=Papirus

# Border rounding
rounding_large=10
rounding_small=5
